<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text to Image - DraftAI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b14;
  color:white;
  min-height:100vh;
}

.header{
  height:70px;
  background:#0b0f1c;
  border-bottom:1px solid #202535;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#7c5cff;
}

.header a{
  color:#aaa;
  text-decoration:none;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.title{
  margin-bottom:30px;
}

.title h1{
  font-size:34px;
  margin-bottom:10px;
}

.title p{
  color:#9da5b8;
  line-height:1.6;
}

.workspace{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.card{
  background:#111625;
  border:1px solid #252c3e;
  border-radius:18px;
  padding:24px;
}

.card h2{
  font-size:20px;
  margin-bottom:18px;
}

label{
  display:block;
  color:#dfe3ed;
  font-size:14px;
  margin:16px 0 8px;
}

textarea,
select{
  width:100%;
  border:1px solid #30384d;
  background:#090d17;
  color:white;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:180px;
  resize:vertical;
  padding:15px;
  line-height:1.5;
}

select{
  padding:13px;
}

textarea:focus,
select:focus{
  border-color:#7c5cff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#7c5cff;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.btn:hover{
  opacity:.9;
}

.btn.secondary{
  background:#202638;
}

.preview{
  min-height:330px;
  border:1px dashed #3a4258;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:#0b101c;
}

.preview-icon{
  font-size:60px;
  margin-bottom:15px;
}

.preview p{
  color:#8f98aa;
  line-height:1.5;
}

.result{
  display:none;
}

.result-box{
  background:#0b101c;
  border:1px solid #30384d;
  border-radius:12px;
  padding:18px;
  line-height:1.6;
  color:#b9c0d0;
  word-break:break-word;
}

.message{
  text-align:center;
  margin-top:15px;
  min-height:22px;
  color:#48e68a;
}

.footer{
  text-align:center;
  color:#687084;
  padding:40px 20px;
  font-size:13px;
}

@media(max-width:750px){

  .header{
    padding:0 18px;
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .title h1{
    font-size:28px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .container{
    padding:30px 15px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Draft<span>AI</span>
  </div>

  <div>
    <a href="dashboard.html">← Dashboard</a>
  </div>

</header>


<main class="container">

  <section class="title">

    <h1>🎨 Text to Image</h1>

    <p>
      अपने text prompt को AI image project में बदलें।
      Style, size और quality अपनी जरूरत के अनुसार चुनें।
    </p>

  </section>


  <div class="workspace">

    <!-- LEFT -->

    <section class="card">

      <h2>Image Prompt</h2>

      <label>
        Describe your image
      </label>

      <textarea
        id="prompt"
        placeholder="उदाहरण: एक भारतीय गाँव में सूर्यास्त के समय खेत में खड़ा किसान, cinematic lighting, realistic photography..."
      ></textarea>


      <div class="row">

        <div>

          <label>Image Style</label>

          <select id="style">

            <option>Realistic</option>
            <option>Cinematic</option>
            <option>Digital Art</option>
            <option>Anime</option>
            <option>3D</option>
            <option>Watercolor</option>
            <option>Fantasy</option>
            <option>Photorealistic</option>

          </select>

        </div>


        <div>

          <label>Image Size</label>

          <select id="size">

            <option>1024 × 1024</option>
            <option>1024 × 1536</option>
            <option>1536 × 1024</option>
            <option>1280 × 720</option>
            <option>720 × 1280</option>

          </select>

        </div>

      </div>


      <div class="row">

        <div>

          <label>Quality</label>

          <select id="quality">

            <option>Standard</option>
            <option>High</option>
            <option>Ultra</option>

          </select>

        </div>


        <div>

          <label>Number of Images</label>

          <select id="count">

            <option>1</option>
            <option>2</option>
            <option>4</option>

          </select>

        </div>

      </div>


      <button
        class="btn"
        onclick="generateImage()"
      >
        ✨ Generate Image
      </button>


      <button
        class="btn secondary"
        onclick="clearPrompt()"
      >
        Clear
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </section>


    <!-- RIGHT -->

    <section class="card">

      <h2>Preview</h2>

      <div
        class="preview"
        id="preview"
      >

        <div>

          <div class="preview-icon">
            🖼️
          </div>

          <p>
            आपकी generated image यहाँ दिखाई देगी।
          </p>

        </div>

      </div>


      <div
        class="result"
        id="result"
      >

        <h2 style="margin-top:22px;">
          Generation Details
        </h2>

        <div
          class="result-box"
          id="resultBox"
        ></div>


        <button
          class="btn secondary"
          onclick="downloadPrompt()"
        >
          ⬇️ Download Details
        </button>

      </div>

    </section>

  </div>

</main>


<footer class="footer">

  DraftAI — Text to Image Workspace

</footer>


<script>

let lastPrompt = "";


function generateImage(){

  const prompt =
    document.getElementById("prompt")
    .value
    .trim();

  const style =
    document.getElementById("style")
    .value;

  const size =
    document.getElementById("size")
    .value;

  const quality =
    document.getElementById("quality")
    .value;

  const count =
    document.getElementById("count")
    .value;


  if(!prompt){

    document.getElementById("message").innerText =
      "❌ पहले Image Prompt लिखिए।";

    return;
  }


  lastPrompt = prompt;


  document.getElementById("preview").innerHTML =

    "<div>" +

    "<div class='preview-icon'>✨</div>" +

    "<h3>Image Generation Ready</h3>" +

    "<p style='margin-top:10px'>" +

    "आपका prompt successfully तैयार है।<br>" +

    "अगले चरण में इसे real AI image generation API से जोड़ा जाएगा।" +

    "</p>" +

    "</div>";


  document.getElementById("resultBox").innerText =

    "Prompt: " + prompt +

    "\n\nStyle: " + style +

    "\nSize: " + size +

    "\nQuality: " + quality +

    "\nImages: " + count;


  document.getElementById("result").style.display =
    "block";


  document.getElementById("message").innerText =
    "✅ Image project तैयार है।";


  localStorage.setItem(
    "draftai_last_image_prompt",
    prompt
  );

}


function clearPrompt(){

  document.getElementById("prompt").value = "";

  document.getElementById("message").innerText = "";

  document.getElementById("result").style.display =
    "none";


  document.getElementById("preview").innerHTML =

    "<div>" +

    "<div class='preview-icon'>🖼️</div>" +

    "<p>आपकी generated image यहाँ दिखाई देगी।</p>" +

    "</div>";

}


function downloadPrompt(){

  if(!lastPrompt){

    alert("पहले Generate Image दबाइए।");

    return;
  }


  const style =
    document.getElementById("style").value;

  const size =
    document.getElementById("size").value;


  const text =

    "DraftAI Text to Image\n\n" +

    "Prompt:\n" +

    lastPrompt +

    "\n\nStyle: " +

    style +

    "\nSize: " +

    size;


  const blob =
    new Blob(
      [text],
      {type:"text/plain"}
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "draftai-image-prompt.txt";

  a.click();


  URL.revokeObjectURL(url);

}

</script>

</body>
</html>
