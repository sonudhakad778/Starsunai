<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text to Image - DraftAI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b14;
  color:white;
  min-height:100vh;
}

.header{
  height:70px;
  background:#0b0f1c;
  border-bottom:1px solid #202535;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#7c5cff;
}

.header a{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.title{
  margin-bottom:30px;
}

.title h1{
  font-size:34px;
  margin-bottom:10px;
}

.title p{
  color:#9da5b8;
  line-height:1.6;
}

.workspace{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.card{
  background:#111625;
  border:1px solid #252c3e;
  border-radius:18px;
  padding:24px;
}

.card h2{
  font-size:20px;
  margin-bottom:18px;
}

label{
  display:block;
  color:#dfe3ed;
  font-size:14px;
  margin:16px 0 8px;
}

textarea,
select{
  width:100%;
  border:1px solid #30384d;
  background:#090d17;
  color:white;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:180px;
  resize:vertical;
  padding:15px;
  line-height:1.5;
}

select{
  padding:13px;
}

textarea:focus,
select:focus{
  border-color:#7c5cff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.button-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.btn{
  width:100%;
  padding:14px 10px;
  border:0;
  border-radius:10px;
  background:#7c5cff;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

.btn.clear{
  background:#252c3e;
}

.btn.download{
  background:#168a57;
}

.preview{
  min-height:330px;
  border:1px dashed #3a4258;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:#0b101c;
}

.preview-icon{
  font-size:60px;
  margin-bottom:15px;
}

.preview p{
  color:#8f98aa;
  line-height:1.5;
}

.details{
  margin-top:20px;
  background:#0b101c;
  border:1px solid #30384d;
  border-radius:12px;
  padding:16px;
  color:#b9c0d0;
  line-height:1.6;
  word-break:break-word;
}

.message{
  text-align:center;
  margin-top:15px;
  min-height:22px;
  color:#48e68a;
}

.footer{
  text-align:center;
  color:#687084;
  padding:40px 20px 25px;
  font-size:13px;
}

@media(max-width:750px){

  .header{
    padding:0 18px;
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .title h1{
    font-size:28px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .button-row{
    grid-template-columns:1fr;
  }

  .container{
    padding:30px 15px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Draft<span>AI</span>
  </div>

  <a href="dashboard.html">
    ← Dashboard
  </a>

</header>


<main class="container">

  <section class="title">

    <h1>🎨 Text to Image</h1>

    <p>
      अपने text prompt को AI image project में बदलें।
      Style, size और quality अपनी जरूरत के अनुसार चुनें।
    </p>

  </section>


  <div class="workspace">

    <!-- LEFT SIDE -->

    <section class="card">

      <h2>📝 Image Prompt</h2>

      <label>
        Describe your image
      </label>

      <textarea
        id="prompt"
        placeholder="उदाहरण: एक भारतीय गाँव में सूर्यास्त के समय खेत में खड़ा किसान, cinematic lighting, ultra realistic photography..."
      ></textarea>


      <div class="row">

        <div>

          <label>Image Style</label>

          <select id="style">

            <option>Ultra Realistic</option>
            <option>Realistic</option>
            <option>Cinematic</option>
            <option>Digital Art</option>
            <option>Anime</option>
            <option>3D</option>
            <option>Watercolor</option>
            <option>Fantasy</option>

          </select>

        </div>


        <div>

          <label>Image Size</label>

          <select id="size">

            <option>Square 1:1</option>
            <option>Portrait 9:16</option>
            <option>Landscape 16:9</option>
            <option>Landscape 4:3</option>
            <option>Portrait 3:4</option>

          </select>

        </div>

      </div>


      <div class="row">

        <div>

          <label>Quality</label>

          <select id="quality">

            <option>Standard</option>
            <option>High</option>
            <option>Ultra</option>

          </select>

        </div>


        <div>

          <label>Number of Images</label>

          <select id="count">

            <option>1</option>
            <option>2</option>
            <option>4</option>

          </select>

        </div>

      </div>


      <!-- ALL BUTTONS ALWAYS VISIBLE -->

      <div class="button-row">

        <button
          class="btn"
          onclick="generateImage()"
        >
          ✨ Generate
        </button>


        <button
          class="btn clear"
          onclick="clearAll()"
        >
          🗑️ Clear
        </button>


        <button
          class="btn download"
          onclick="downloadDetails()"
        >
          ⬇️ Download
        </button>

      </div>


      <div
        id="message"
        class="message"
      ></div>

    </section>


    <!-- RIGHT SIDE -->

    <section class="card">

      <h2>🖼️ Preview</h2>

      <div
        class="preview"
        id="preview"
      >

        <div>

          <div class="preview-icon">
            🖼️
          </div>

          <p>
            आपकी generated image यहाँ दिखाई देगी।
          </p>

        </div>

      </div>


      <div
        class="details"
        id="details"
      >

        <strong>
          Generation Details
        </strong>

        <br><br>

        अभी कोई image generate नहीं हुई है।

      </div>

    </section>

  </div>

</main>


<footer class="footer">

  DraftAI — Text to Image Workspace

</footer>


<script>

let generatedData = "";


function generateImage(){

  const prompt =
    document.getElementById("prompt")
    .value
    .trim();

  const style =
    document.getElementById("style")
    .value;

  const size =
    document.getElementById("size")
    .value;

  const quality =
    document.getElementById("quality")
    .value;

  const count =
    document.getElementById("count")
    .value;


  if(!prompt){

    document.getElementById("message").innerText =
      "❌ पहले Image Prompt लिखिए।";

    return;
  }


  generatedData =
    "DraftAI Text to Image\n\n" +

    "Prompt:\n" +
    prompt +

    "\n\nStyle: " +
    style +

    "\nImage Size: " +
    size +

    "\nQuality: " +
    quality +

    "\nNumber of Images: " +
    count;


  document.getElementById("preview").innerHTML =

    "<div>" +

    "<div class='preview-icon'>✨</div>" +

    "<h3>Prompt तैयार है!</h3>" +

    "<p style='margin-top:12px'>" +

    "AI Image Generation API अगले चरण में जोड़ी जाएगी।" +

    "</p>" +

    "</div>";


  document.getElementById("details").innerHTML =

    "<strong>Generation Details</strong>" +

    "<br><br>" +

    "<b>Prompt:</b><br>" +

    prompt +

    "<br><br>" +

    "<b>Style:</b> " +
    style +

    "<br>" +

    "<b>Size:</b> " +
    size +

    "<br>" +

    "<b>Quality:</b> " +
    quality +

    "<br>" +

    "<b>Images:</b> " +
    count;


  document.getElementById("message").innerText =
    "✅ Image project तैयार है।";


  localStorage.setItem(
    "draftai_last_image_prompt",
    prompt
  );

}


function clearAll(){

  document.getElementById("prompt").value = "";

  document.getElementById("style").selectedIndex = 0;

  document.getElementById("size").selectedIndex = 0;

  document.getElementById("quality").selectedIndex = 0;

  document.getElementById("count").selectedIndex = 0;


  generatedData = "";


  document.getElementById("message").innerText =
    "🗑️ सभी fields clear हो गईं।";


  document.getElementById("preview").innerHTML =

    "<div>" +

    "<div class='preview-icon'>🖼️</div>" +

    "<p>आपकी generated image यहाँ दिखाई देगी।</p>" +

    "</div>";


  document.getElementById("details").innerHTML =

    "<strong>Generation Details</strong>" +

    "<br><br>" +

    "अभी कोई image generate नहीं हुई है।";

}


function downloadDetails(){

  if(!generatedData){

    const prompt =
      document.getElementById("prompt")
      .value
      .trim();


    if(!prompt){

      alert(
        "पहले Prompt लिखें या Generate दबाएँ।"
      );

      return;
    }


    generatedData =
      "DraftAI Text to Image\n\n" +

      "Prompt:\n" +
      prompt +

      "\n\nStyle: " +
      document.getElementById("style").value +

      "\nImage Size: " +
      document.getElementById("size").value +

      "\nQuality: " +
      document.getElementById("quality").value +

      "\nNumber of Images: " +
      document.getElementById("count").value;

  }


  const blob =
    new Blob(
      [generatedData],
      {type:"text/plain"}
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href = url;

  link.download =
    "draftai-text-to-image.txt";


  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);


  URL.revokeObjectURL(url);


  document.getElementById("message").innerText =
    "✅ Download शुरू हो गया।";

}

</script>

</body>
</html>
