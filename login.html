<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - DraftAI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b14;
  color:white;
  min-height:100vh;
}

.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  background:#0b0f1c;
  border-bottom:1px solid #202535;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#7c5cff;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:white;
}

.container{
  max-width:500px;
  margin:55px auto;
  padding:20px;
}

.card{
  background:#111625;
  border:1px solid #252c3e;
  border-radius:20px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#9da5b8;
  line-height:1.5;
  margin-bottom:30px;
}

label{
  display:block;
  margin:16px 0 8px;
  color:#dfe3ed;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #30384d;
  background:#090d17;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#7c5cff;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:75px;
}

.show-btn{
  position:absolute;
  right:8px;
  top:8px;
  padding:7px 10px;
  border:none;
  border-radius:7px;
  background:#252c3e;
  color:#ddd;
  cursor:pointer;
}

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0;
  font-size:13px;
}

.remember{
  display:flex;
  align-items:center;
  gap:7px;
  color:#aaa;
}

.remember input{
  width:17px;
  height:17px;
}

.forgot{
  color:#8d78ff;
  text-decoration:none;
}

.login-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:11px;
  background:linear-gradient(135deg,#7c5cff,#5b3df5);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover{
  opacity:.9;
}

.message{
  text-align:center;
  margin-top:15px;
  min-height:20px;
  font-size:14px;
}

.error{
  color:#ff6262;
}

.success{
  color:#48e68a;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0;
  color:#687084;
  font-size:13px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#292f40;
}

.signup{
  text-align:center;
  color:#9da5b8;
  font-size:14px;
}

.signup a{
  color:#8d78ff;
  text-decoration:none;
  font-weight:bold;
}

.home{
  text-align:center;
  margin-top:22px;
}

.home a{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

@media(max-width:600px){

  .header{
    padding:0 20px;
  }

  .container{
    margin:25px auto;
    padding:15px;
  }

  .card{
    padding:23px;
  }

  h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Draft<span>AI</span>
  </div>

  <a class="back" href="index.html">
    ← Back to Home
  </a>

</header>


<div class="container">

  <div class="card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      अपने DraftAI account में Login करें।
    </p>


    <form id="loginForm">

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
        required
      >


      <label>Password</label>

      <div class="password-box">

        <input
          type="password"
          id="password"
          placeholder="अपना Password लिखें"
          required
        >

        <button
          type="button"
          class="show-btn"
          onclick="togglePassword()"
        >
          Show
        </button>

      </div>


      <div class="options">

        <label class="remember">

          <input
            type="checkbox"
            id="remember"
          >

          Remember Me

        </label>


        <a
          href="#"
          class="forgot"
          onclick="forgotPassword()"
        >
          Forgot Password?
        </a>

      </div>


      <button
        type="submit"
        class="login-btn"
      >
        Login
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </form>


    <div class="divider">
      OR
    </div>


    <div class="signup">

      नया account बनाना है?

      <a href="signup.html">
        Sign Up
      </a>

    </div>


    <div class="home">

      <a href="index.html">
        ← वापस Home पर जाएँ
      </a>

    </div>

  </div>

</div>


<script>

function togglePassword(){

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-btn");


  if(password.type === "password"){

    password.type = "text";

    button.innerText = "Hide";

  }else{

    password.type = "password";

    button.innerText = "Show";

  }

}


function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.innerText = text;

  message.className =
    "message " + type;

}


function forgotPassword(){

  alert(
    "Demo Version:\n\n" +
    "Password reset system अभी तैयार नहीं है।\n" +
    "बाद में इसमें real password recovery जोड़ी जाएगी।"
  );

}


document
.getElementById("loginForm")
.addEventListener("submit",function(e){

  e.preventDefault();


  const email =
    document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();


  const password =
    document
    .getElementById("password")
    .value;


  const remember =
    document
    .getElementById("remember")
    .checked;


  const savedUser =
    localStorage.getItem("draftai_user");


  if(!savedUser){

    showMessage(
      "❌ कोई account नहीं मिला। पहले Sign Up करें।",
      "error"
    );

    return;
  }


  const user =
    JSON.parse(savedUser);


  if(
    email !== user.email ||
    password !== user.password
  ){

    showMessage(
      "❌ Email या Password गलत है।",
      "error"
    );

    return;
  }


  localStorage.setItem(
    "draftai_logged_in",
    "true"
  );


  localStorage.setItem(
    "draftai_login_email",
    user.email
  );


  localStorage.setItem(
    "draftai_user_name",
    user.name
  );


  if(remember){

    localStorage.setItem(
      "draftai_remember",
      "true"
    );

  }else{

    localStorage.removeItem(
      "draftai_remember"
    );

  }


  showMessage(
    "✅ Login सफल हुआ! Dashboard खोल रहे हैं...",
    "success"
  );


  setTimeout(function(){

    window.location.href =
      "dashboard.html";

  },1000);

});


/* पुराने Remember Me की स्थिति */

window.addEventListener("load",function(){

  const remembered =
    localStorage.getItem("draftai_remember");

  if(remembered === "true"){

    document.getElementById("remember").checked = true;

  }

});

</script>

</body>
</html>
